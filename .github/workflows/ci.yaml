name: Continuous Integration

on: [pull_request, workflow_dispatch]

jobs:
  setup:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            flutter_path: /opt/hostedtoolcache/flutter
      fail-fast: false

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
      - name: Cache Flutter dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.flutter_path }}
          key: ${{ runner.os }}-flutter-3.0.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
      - name: "Prepare Flutter Environment"
        run: ./.github/workflows/scripts/prepare-env.sh
      - name: "Install Tools"
        run: |
          ./.github/workflows/scripts/install-tools.sh

  analyze:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@148d9a848c6acaf90a3ec30bc5062f646f8a4163 # 0.5.0
        with:
          access_token: ${{ github.token }}
      - name: Configuring java
        uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1.4.5
        with:
          java-version: 12.x
      - name: Cache Flutter dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-3.0.0
      - name: Configuring flutter environment
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.0.0"
          channel: "stable"
      - name: "Prepare Flutter Environment"
        run: ./.github/workflows/scripts/prepare-env.sh
      - name: "Install Tools"
        run: |
          ./.github/workflows/scripts/install-tools.sh
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "Dart Analyze"
        run: melos run analyze

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@148d9a848c6acaf90a3ec30bc5062f646f8a4163 # 0.5.0
        with:
          access_token: ${{ github.token }}
      - name: Configuring java
        uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1.4.5
        with:
          java-version: 12.x
      - name: Cache Flutter dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-3.0.0
      - name: Configuring flutter environment
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.0.0"
          channel: "stable"
      - name: "Prepare Flutter Environment"
        run: ./.github/workflows/scripts/prepare-env.sh
      - name: "Install Tools"
        run: |
          ./.github/workflows/scripts/install-tools.sh
          curl -sL https://github.com/google/google-java-format/releases/download/google-java-format-1.3/google-java-format-1.3-all-deps.jar -o $HOME/google-java-format.jar
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "Formatter"
        run: melos run format
      - name: "Validating formatter"
        run: ./.github/workflows/scripts/validate-formatting.sh

  build_torch_controller_example_ubuntu:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@148d9a848c6acaf90a3ec30bc5062f646f8a4163 # 0.5.0
        with:
          access_token: ${{ github.token }}
      - name: Configuring java
        uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1.4.5
        with:
          java-version: 12.x
      - name: Cache Flutter dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-3.0.0
      - name: Configuring flutter environment
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.0.0"
          channel: "stable"
      - name: "Prepare Flutter Environment"
        run: ./.github/workflows/scripts/prepare-env.sh
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "torch_controller_example app bundle"
        run: cd packages/torch_controller/example && flutter build appbundle

  test_torch_controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@148d9a848c6acaf90a3ec30bc5062f646f8a4163 # 0.5.0
        with:
          access_token: ${{ github.token }}
      - name: Configuring java
        uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1.4.5
        with:
          java-version: 12.x
      - name: Cache Flutter dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-3.0.0
      - name: Configuring flutter environment
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.0.0"
          channel: "stable"
      - name: "Prepare Flutter Environment"
        run: ./.github/workflows/scripts/prepare-env.sh
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "Flutter Test"
        run: melos run test:torch:controller

  test_storage_controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          fetch-depth: 0
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@148d9a848c6acaf90a3ec30bc5062f646f8a4163 # 0.5.0
        with:
          access_token: ${{ github.token }}
      - name: Configuring java
        uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1.4.5
        with:
          java-version: 12.x
      - name: Cache Flutter dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter-3.0.0
      - name: Configuring flutter environment
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.0.0"
          channel: "stable"
      - name: "Prepare Flutter Environment"
        run: ./.github/workflows/scripts/prepare-env.sh
      - name: "Install Tools"
        run: ./.github/workflows/scripts/install-tools.sh
      - name: "Bootstrap Workspace"
        run: melos bootstrap
      - name: "Flutter Test"
        run: melos run test:storage:controller
